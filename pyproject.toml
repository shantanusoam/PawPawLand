[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["website/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
# H006: img width/height attrs — images are sized responsively via Tailwind classes.
# H021: inline styles — used only for CSS custom properties computed per-request
# (e.g. marquee scroll duration), which Tailwind's build-time class scanning can't express.
ignore = "H006,H021,H031"
