{% load static %}
<div class="fade-up flex flex-col items-center">
  <div class="wiggle-hover relative h-[159px] w-[159px]" data-pop>
    <img src="{% static 'img/feature-circle.svg' %}"
         alt=""
         class="h-full w-full">
    <span class="absolute inset-0 flex items-center justify-center text-5xl text-white">
      {% include "website/icons/paw-print.html" %}
    </span>
  </div>
  <h3 class="mt-4 font-display text-xl font-bold text-ink">{{ title }}</h3>
  <p class="mt-3 max-w-[230px] text-sm leading-relaxed text-muted-dark">{{ text }}</p>
</div>
